# Example configuration for lofi-focus-tui.
#
# Copy this file to config.toml in the repository directory (or to
# ~/.config/lofi-focus-tui/config.toml) and edit the values for your machine:
#
#   cp config.example.toml config.toml
#
# config.toml is git-ignored, so your local settings (LAN IPs, API keys)
# stay out of the repository.

# TUI color theme: city_pop, neon_tokyo, vhs, sakura, midnight, cassette,
# arcade, or rain. Cycle themes live with the t key in the TUI.
theme = "city_pop"

[generation]
# Backend: mock | ace-step | ace-step-http | runpod
# ace-step-http is the normal default; mock is an explicit development fallback.
backend = "ace-step-http"
output_format = "wav"
inference_steps = 27
guidance_scale = 15.0
batch_size = 1
# Maximum chunk size in seconds (10-600). Longer sessions are split into chunks.
chunk_seconds = 600
# Optional ACE-Step checkpoint path for the embedded ace-step backend.
checkpoint_path = ""

[playback]
volume = 0.8
fade_seconds = 1.5

[ace_step_http]
# ACE-Step-1.5 REST API. Use http://LAN_IP:8001 when ACE-Step runs on
# another machine on your LAN.
base_url = "http://127.0.0.1:8001"
api_key = ""
# Total remote task deadline and HTTP client timeout.
timeout_seconds = 1800.0

[runpod]
# Optional RunPod-style remote adapter.
api_key = ""
gpu_type = "NVIDIA GeForce RTX 4090"
template_id = ""
volume_id = ""
auto_destroy = true
